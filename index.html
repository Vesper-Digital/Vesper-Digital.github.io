<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vesper Digital</title>
<meta name="description" content="Media · Power · Accountability">
<meta property="og:title" content="Vesper Digital">
<meta property="og:description" content="Media · Power · Accountability">
<meta property="og:image" content="cover.jpg">
<link rel="icon" href="cover.jpg">
<style>
  :root{
    --bg:#121212;
    --text:#e8e8e8;
    --muted:#8a8a8a;
    --red:#ff1f2d;
    --line:#242424;
    --cut:34px;
    --sq:clamp(260px, 42vh, 460px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:linear-gradient(to top, #000 0%, #0a0a0a 38%, var(--bg) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:"Barlow Condensed","Oswald","Archivo Narrow",Helvetica,Arial,sans-serif;
    font-size:20px;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  .stack{width:var(--sq);display:flex;flex-direction:column;gap:26px}

  /* PORTRAIT */
  .cover{
    width:var(--sq);
    height:var(--sq);
    display:block;
    position:relative;
    background:transparent;
    filter:drop-shadow(0 0 1px rgba(255,255,255,.18))
           drop-shadow(0 22px 46px rgba(0,0,0,.85))
           drop-shadow(0 6px 14px rgba(0,0,0,.6));
  }
  .cover img{
    display:block;width:100%;height:100%;object-fit:cover;background:#000;
    clip-path:polygon(var(--cut) 0, 100% 0, 100% 100%, 0 100%, 0 var(--cut));
    transition:filter .35s ease;
  }
  /* frosted pane + a sheen that crosses on hover */
  .cover::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    clip-path:polygon(var(--cut) 0, 100% 0, 100% 100%, 0 100%, 0 var(--cut));
    background-image:
      linear-gradient(118deg,
        transparent 38%,
        rgba(255,255,255,.10) 46%,
        rgba(255,255,255,.34) 50%,
        rgba(255,255,255,.10) 54%,
        transparent 62%),
      linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,0) 58%);
    background-size:260% 100%, 100% 100%;
    background-position:130% 0, 0 0;
    background-repeat:no-repeat;
    opacity:0;
    transition:opacity .25s ease, background-position .9s cubic-bezier(.2,.65,.25,1);
  }
  .cover:hover::after{opacity:1;background-position:-30% 0, 0 0}
  .cover:hover img{filter:brightness(1.07) saturate(1.06)}

  .tagline{
    text-align:center;
    letter-spacing:.26em;
    text-transform:uppercase;
    font-size:17px;
    color:var(--muted);
    margin-top:-6px;
  }

  /* LINKS */
  .links{display:flex;flex-direction:column;gap:14px}
  .go{
    position:relative;
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px 22px;
    border:0;
    background:var(--red);
    color:#fff;
    text-decoration:none;
    font-size:19px;
    font-weight:700;
    letter-spacing:.2em;
    text-transform:uppercase;
    clip-path:polygon(18px 0, 100% 0, 100% 100%, 0 100%, 0 18px);
  }
  .go::before{
    content:"";
    position:absolute;
    inset:2px;
    background:#000;
    clip-path:polygon(16px 0, 100% 0, 100% 100%, 0 100%, 0 16px);
    transition:background .16s ease;
  }
  .go > *{position:relative;z-index:1}
  .go:hover::before{background:var(--red)}
  .go .ico{width:26px;height:26px;flex:none;display:block}
  .go .ico svg{width:100%;height:100%;display:block;fill:currentColor}
  .go .arrow{margin-left:auto;font-size:22px;line-height:1;opacity:.55}
  .go:hover .arrow{opacity:1}

  .go.alt{background:#3a3a3a;color:#cfcfcf}
  .go.alt:hover{color:#000}
  .go.alt:hover::before{background:#fff}

  /* ENTRANCE */
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .rz{opacity:0}
  .rz.in{animation:rise .9s cubic-bezier(.16,.72,.24,1) forwards}

  @media (max-width:420px){
    .go{font-size:17px;padding:16px 18px;gap:14px}
    .tagline{font-size:15px;letter-spacing:.2em}
  }
</style>
</head>
<body>

<main class="stack">

  <span class="cover rz" data-rz="0">
    <img src="cover.jpg" alt="Vesper Digital">
  </span>

  <p class="tagline rz" data-rz="320">Media · Power · Accountability</p>

  <nav class="links">
    <a class="go rz" data-rz="640" href="https://vesper-digital.github.io/Evidence-Archive/">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M14 2v5h5M9 13h6M9 17h6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </svg></span>
      <span>Evidence Archive</span>
      <span class="arrow">&rsaquo;</span>
    </a>

    <a class="go alt rz" data-rz="820" href="https://www.youtube.com/@Vesperdigital" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M10 8.2l6.2 3.8L10 15.8z" fill="currentColor"/>
      </svg></span>
      <span>YouTube</span>
      <span class="arrow">&rsaquo;</span>
    </a>

    <a class="go alt rz" data-rz="1000" href="https://x.com/vesperdigital" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/>
      </svg></span>
      <span>X</span>
      <span class="arrow">&rsaquo;</span>
    </a>
  </nav>

</main>

<script>
(function(){
  var items = document.querySelectorAll('.rz');
  if (!items.length) return;
  [].forEach.call(items, function(el){
    var d = parseInt(el.getAttribute('data-rz') || '0', 10);
    setTimeout(function(){ el.classList.add('in'); }, d);
  });
})();
</script>
</body>
</html>
